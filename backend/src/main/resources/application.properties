spring.application.name=P-verse

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=pverse_user
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./data/uploads

# Avatar Upload
app.upload.dir=uploads/avatars

# Moment Upload
app.moment.upload-dir=uploads/moments
app.moment.max-file-size=10MB

# JWT Configuration
jwt.secret=your-very-long-secret-key-at-least-256-bits-long-for-HS256-algorithm
jwt.expiration=86400000